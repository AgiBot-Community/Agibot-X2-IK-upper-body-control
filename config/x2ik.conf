# X2 MDI / MoveJ 机器人配置模板：复制到机器人后按实际环境填写。
# 填写说明见交付包 docs/CONFIGURATION_GUIDE.md。
# 此文件不含任何机器的实际配置；REPLACE_WITH_ROBOT 路径必须替换。
# 格式：每行 KEY=value。不要写 export，不要给值加引号。
# 使用机器人上的绝对路径；不要写 $HOME、${变量} 或 shell 命令。
# 注释独占一行。已有进程环境中的同名变量优先于本文件。

# 必填：与该机器人架构/ROS Python 匹配的 aimdk_msgs 安装前缀。
# 在机器人已加载 ROS/AimDK 环境的终端运行 ros2 pkg prefix aimdk_msgs 获取。
# 典型值：/opt/aimdk/install/aimdk_msgs；合并安装时可能是 /opt/aimdk/install。
# 不要填写源码 src/aimdk_msgs、Python 包目录或 wheel 存放目录。
X2_AIMDK_MSGS=/REPLACE_WITH_ROBOT/aimdk/install/aimdk_msgs

# 可选：优先使用的 ROS Python 解释器，须按该机器人实际环境确认。
# X2_ROS_PYTHON=/usr/bin/python3

# 可选：机器标识，仅用于记录，不会自动识别硬件或选择补偿参数。
# X2_ROBOT_SN=REPLACE_WITH_VERIFIED_ROBOT_SN

# 必须核对客户端 RMW；机器人现用值不同于 rmw_fastrtps_cpp 时须明确填写。
# 不填写且未指定相关环境时，标准真机启动使用 rmw_fastrtps_cpp。
# 以下只是示例；须由维护者确认，不要据此修改机器人原有 DDS 配置。
# X2_RMW=rmw_fastrtps_cpp

# 仅支持 URS。客户使用机器人原有工具切换模式，MDI 不提供切换功能。
X2_URS_ONLY=1

# X2IK_CONFIG 是指向本文件的外部环境变量，不要写在本文件中。
# SSH 地址、运行目录、私钥路径在桌面 MDI 中填写。
# 自定义 TCP JSON 通过 MDI 的 TCP 文件框或 --tcp-file / tcp_file 指定。
